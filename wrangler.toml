"$schema" = "./node_modules/wrangler/config-schema.json"
name = "scrapeman-landing"

# Set this to today's date
compatibility_date = "2026-06-18"

# deploy to a custom .workers.dev domain. our target is scrape.do, .workers.dev is just an additional deployment target.
workers_dev = true

[assets]
directory="./dist"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
